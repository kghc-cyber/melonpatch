<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melon Patch | Pilot Program</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --honeydew-mist: #F8FFF8;
            --rind-green: #86C28B;
            --dark-sage: #4A5C4C;
        }

        body {
            background-color: var(--honeydew-mist) !important;
            font-family: 'Inter', sans-serif;
            color: var(--dark-sage);
            -webkit-font-smoothing: antialiased;
            margin: 0;
            padding: 0;
        }

        h1, h2, .serif-brand {
            font-family: 'Playfair Display', serif !important;
            font-style: italic !important;
            font-weight: 400 !important;
            color: var(--dark-sage);
        }

        .caps-tracking, footer {
            font-family: 'Inter', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.4em;
            font-size: 0.7rem;
        }

        .logo {
            max-width: 180px;
            height: auto;
            mix-blend-mode: multiply; 
        }

        /* Solid Green Button Styling */
        .btn-solid {
            display: inline-block;
            background-color: var(--rind-green);
            color: white;
            padding: 16px 36px;
            text-decoration: none;
            transition: all 0.3s ease;
            font-weight: 600;
            border: 1px solid var(--rind-green);
        }

        .btn-solid:hover {
            background-color: transparent;
            color: var(--rind-green);
            letter-spacing: 0.45em;
        }

        .img-container {
            mix-blend-mode: multiply;
        }
    </style>
</head>
<body class="flex flex-col items-center">

    <header class="pt-[50px] pb-[20px] w-full flex justify-center">
        <img src="https://melonpatch.co/logo.png" alt="MELONPATCH" class="logo">
    </header>

    <main class="max-w-[600px] w-[90%] flex flex-col items-center text-center pb-24">

        <section class="mb-16">
            <h1 class="text-4xl md:text-5xl mb-6">Stay Fresh. Stay You.</h1>
            <p class="serif-brand text-lg opacity-85 leading-relaxed italic">
                Welcome and thank you for participating in the Melon Patch pilot. We hope you enjoy the experience, and we would value your perspective.
            </p>
        </section>

        <section class="w-full">
            <div class="img-container p-4 bg-white border border-stone-100 rounded-sm">
                <img src="IMG_3187.png" alt="How to wear your Melon Patch liner" class="w-full h-auto">
            </div>
        </section>

        <section class="mt-12 py-16 border-t border-[var(--rind-green)] w-full">
            <h2 class="text-4xl mb-6 italic">Your Experience</h2>
            <p class="serif-brand text-xl mb-10 opacity-85">
                Your insight is essential as we refine the closest layers of comfort.
            </p>
            <a href="https://docs.google.com/forms/d/e/1FAIpQLSeUwQvZtgHKhFYYyOBYHRtnPPk55Y-1WWSRfl4--41t5sYJzg/viewform?usp=header" 
               target="_blank" 
               class="btn-solid caps-tracking">
                Full Experience Survey
            </a>
        </section>

    </main>

    <footer class="caps-tracking opacity-40 py-12">
        Est. 2026
    </footer>

</body>
</html>
